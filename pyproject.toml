[project]
name = "xerama"
version = "0.1.0"
description = "Xerama - AI microdrama production system"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # MODULE-066 - dependency vulnerability scanning. Run via
    # `pip-audit` (checks installed packages against the PyPI advisory
    # database); no CI pipeline exists yet to run this automatically
    # (MODULE-069/070), so it is a manual pre-release check for now.
    "pip-audit>=2.7",
    # MODULE-071 - coverage reporting. Run via `pytest --cov=xerama`.
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
